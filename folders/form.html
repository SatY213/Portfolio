<style>
  .contact-item {
    transition: all 0.3s ease;
    border-left: 3px solid transparent;
  }
  .contact-item:hover {
    background-color: rgba(255, 255, 255, 0.05);
    border-left-color: #4299e1;
  }
  .social-icon {
    transition: transform 0.3s ease;
  }
  .social-icon:hover {
    transform: scale(1.2);
  }
  ::-webkit-scrollbar {
    width: 8px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.3);
  }
  .form-input {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    padding: 10px 12px;
    color: white;
    transition: all 0.3s ease;
  }
  .form-input:focus {
    outline: none;
    border-color: #4299e1;
    background: rgba(255, 255, 255, 0.08);
  }
  .form-input::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }
</style>

<div
  class="w-full h-auto max-h-[calc(100vh_-_56px)] bg-gray-800 overflow-hidden shadow-2xl window"
>
  <!-- Title bar -->
  <div class="window-header flex justify-between items-center p-3 bg-gray-700">
    <div class="flex items-center space-x-2">
      <div class="w-5 h-5 flex items-center justify-center">
        <i class="fas fa-envelope text-green-400 text-xs"></i>
      </div>
      <span class="text-white text-sm">Contact Form</span>
    </div>
    <div class="flex space-x-2">
      <!-- Minimize -->
      <div
        class="cursor-pointer w-6 h-6 flex items-center justify-center hover:bg-gray-600 rounded text-gray-300"
        id="minimize_btn_form" role="button" tabindex="0" aria-label="Minimize window"
      >
        <span aria-hidden="true">&minus;</span>
      </div>

      <!-- Maximize -->
      <div
        class="cursor-pointer w-6 h-6 flex items-center justify-center hover:bg-gray-600 rounded text-gray-300"
        id="maximize_btn_form" role="button" tabindex="0" aria-label="Maximize window"
      >
        <span aria-hidden="true">&#9633;</span>
      </div>

      <!-- Close -->
      <div
        class="cursor-pointer w-6 h-6 flex items-center justify-center hover:bg-red-500 rounded text-gray-300"
        id="close_btn_form" role="button" tabindex="0" aria-label="Close window"
      >
        <span aria-hidden="true">&times;</span>
      </div>
    </div>
  </div>

  <!-- Content area -->
  <div
    class="window-content p-6 h-auto max-h-[calc(100vh_-_100px)] overflow-y-auto bg-gray-900 text-gray-200"
  >
    <h2
      class="text-2xl font-semibold mb-6 text-white border-b border-gray-700 pb-2 flex items-center"
    >
      <i class="fas fa-paper-plane mr-3 text-purple-400"></i> Send Me a Message
    </h2>

    <!-- Contact Form -->
    <form class="space-y-6" id="contactForm">
      <!-- Name and Email Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Name -->
        <div>
          <label for="contact-name" class="block text-sm font-medium text-gray-300 mb-2">
            <i class="fas fa-user mr-2 text-blue-400"></i>Full Name
          </label>
          <input id="contact-name" name="name"
            type="text"
            class="w-full form-input"
            placeholder="Enter your full name"
            required
          />
        </div>

        <!-- Email -->
        <div>
          <label for="contact-email" class="block text-sm font-medium text-gray-300 mb-2">
            <i class="fas fa-envelope mr-2 text-red-400"></i>Email Address
          </label>
          <input id="contact-email" name="email"
            type="email"
            class="w-full form-input"
            placeholder="your.email@example.com"
            required
          />
        </div>
      </div>

      <!-- Subject -->
      <div>
        <label for="contact-subject" class="block text-sm font-medium text-gray-300 mb-2">
          <i class="fas fa-tag mr-2 text-green-400"></i>Subject
        </label>
        <input id="contact-subject" name="subject"
          type="text"
          class="w-full form-input"
          placeholder="What is this regarding?"
          required
        />
      </div>

      <!-- Message -->
      <div>
        <label for="contact-message" class="block text-sm font-medium text-gray-300 mb-2">
          <i class="fas fa-comment mr-2 text-yellow-400"></i>Message
        </label>
        <textarea id="contact-message" name="message"
          class="w-full form-input h-32 resize-none"
          placeholder="Type your message here..."
          required
        ></textarea>
      </div>

      <p class="text-sm text-gray-400">This opens your email app with a draft. Send the message there to contact me.</p>
      <!-- Submit Button -->
      <div class="flex justify-center pt-4 border-t border-gray-700">
        <button type="submit"
          class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-6 rounded flex items-center"
        >
          <i class="fas fa-paper-plane mr-2"></i> Open Email App
        </button>
      </div>
    </form>
  </div>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function (event) {
  event.preventDefault();
  const fields = new FormData(this);
  const body = `${fields.get("message")}\n\nFrom: ${fields.get("name")}\nEmail: ${fields.get("email")}`;
  window.location.href = `mailto:abdelhakimerini@gmail.com?subject=${encodeURIComponent(fields.get("subject"))}&body=${encodeURIComponent(body)}`;
});
</script>
