<script>
const pages = document.getElementById('pdf_pages');
const zoom = document.getElementById('zoom_value');
const prev = document.getElementById('prev_page');
const next = document.getElementById('next_page');
const zoomIn = document.getElementById('zoom_in');
const zoomOut = document.getElementById('zoom_out');
zoomIn.setAttribute('aria-label', 'Zoom in');
zoomOut.setAttribute('aria-label', 'Zoom out');
const controls = [prev, next, zoomIn, zoomOut];
controls.forEach(button => button.disabled = true);
let pdf, pageNumber = 1, scale = 1, revision = 0, resizeTimer;
let fitted = true;
function showError() {
  pages.innerHTML = '<p>Unable to display the resume.</p><a href="./images/resume.pdf" target="_blank" rel="noopener noreferrer" class="text-blue-400 underline">Open or download the PDF</a>';
}
async function render() {
  if (!pdf || !pages.clientWidth) return;
  const request = ++revision;
  try {
    const page = await pdf.getPage(pageNumber);
    if (request !== revision || !pages.clientWidth) return;
    if (fitted) scale = Math.min(1, Math.max(0.1, (pages.clientWidth - 24) / page.getViewport({ scale: 1 }).width));
    const viewport = page.getViewport({ scale });
    const ratio = window.devicePixelRatio || 1;
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = `${viewport.width}px`;
    canvas.style.height = `${viewport.height}px`;
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', `Resume, page ${pageNumber}`);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport, transform: [ratio, 0, 0, ratio, 0, 0] }).promise;
    if (request !== revision || !pages.clientWidth) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'pdf-page';
    wrapper.append(canvas);
    const info = document.createElement('a');
    info.className = 'page-info text-blue-400 underline';
    info.href = './images/resume.pdf'; info.target = '_blank'; info.rel = 'noopener noreferrer';
    info.textContent = `Page ${pageNumber} of ${pdf.numPages} - Open original PDF`;
    pages.replaceChildren(wrapper, info);
    zoom.textContent = `${Math.round(scale * 100)}%`;
    prev.disabled = pageNumber <= 1;
    next.disabled = pageNumber >= pdf.numPages;
    zoomIn.disabled = scale >= 3;
    zoomOut.disabled = scale <= 0.2;
  } catch { if (request === revision) showError(); }
}
prev.addEventListener('click', () => { if (pageNumber > 1) { pageNumber--; render(); } });
next.addEventListener('click', () => { if (pdf && pageNumber < pdf.numPages) { pageNumber++; render(); } });
zoomIn.addEventListener('click', () => { fitted = false; scale = Math.min(3, scale + 0.1); render(); });
zoomOut.addEventListener('click', () => { fitted = false; scale = Math.max(0.2, scale - 0.1); render(); });
let lastWidth = 0;
new ResizeObserver(() => {
  if (pages.clientWidth === lastWidth) return;
  lastWidth = pages.clientWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 100);
}).observe(pages);
(async () => {
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdf = await pdfjsLib.getDocument('./images/resume.pdf').promise;
    await render();
  } catch { showError(); }
})();
</script>
