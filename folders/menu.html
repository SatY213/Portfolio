<div class="window bg-gray-800 overflow-hidden shadow-2xl">
  <div class="bg-gray-900 text-gray-200 flex flex-col">
    <div class="p-4"><label for="app-search" class="block text-sm mb-2">Search apps</label><input id="app-search" type="search" placeholder="Search apps..." class="w-full bg-gray-800 rounded-lg p-3 text-white" /></div>
    <div class="flex-1 overflow-y-auto px-4"><h3 class="text-xs text-gray-400 uppercase mb-3">Pinned</h3><div class="grid grid-cols-3 gap-2" id="pinned-apps">
<button type="button" data-open="project" class="start-menu-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-700"><img src="./images/FolderIcon.png" alt="" class="w-8 h-8 mb-2"/><span class="text-sm">Projects</span></button>
<button type="button" data-open="about" class="start-menu-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-700"><img src="./images/infoIcon.png" alt="" class="w-8 h-8 mb-2"/><span class="text-sm">About Me</span></button>
<button type="button" data-open="contact" class="start-menu-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-700"><img src="./images/ContactIcon.png" alt="" class="w-8 h-8 mb-2"/><span class="text-sm">Contact</span></button>
<button type="button" data-open="resume" class="start-menu-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-700"><img src="./images/pdfIcon.png" alt="" class="w-8 h-8 mb-2"/><span class="text-sm">Resume</span></button>
<button type="button" data-open="browser" class="start-menu-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-700"><img src="./images/browserIcon.png" alt="" class="w-8 h-8 mb-2"/><span class="text-sm">Browser</span></button>
<button type="button" data-open="form" class="start-menu-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-700"><i class="fas fa-envelope text-green-400 text-3xl mb-2"></i><span class="text-sm">Contact Form</span></button>
<button type="button" data-open="music" class="start-menu-item flex flex-col items-center p-3 rounded-lg hover:bg-gray-700"><span class="text-3xl text-purple-400 mb-2" aria-hidden="true">&#9835;</span><span class="text-sm">Music</span></button>
    </div><p id="no-apps" class="hidden text-sm text-gray-400 py-4">No matching apps.</p></div>
    <div class="p-4 border-t border-gray-700 flex items-center justify-between gap-3"><span class="text-sm">Abdelhakim MERINI</span><button type="button" id="close-menu" class="p-3 rounded hover:bg-gray-700" aria-label="Close Start menu"><i class="fas fa-times"></i></button></div>
  </div>
</div>
<script>
const search = document.getElementById('app-search');
search.addEventListener('input', () => {
  let matches = 0;
  document.querySelectorAll('#pinned-apps button').forEach(button => {
    const match = button.textContent.toLowerCase().includes(search.value.trim().toLowerCase());
    button.style.display = match ? '' : 'none';
    if (match) matches++;
  });
  document.getElementById('no-apps').classList.toggle('hidden', matches > 0);
});
document.getElementById('close-menu').addEventListener('click', () => document.getElementById('menu_task_icon').parentElement.click());
</script>
